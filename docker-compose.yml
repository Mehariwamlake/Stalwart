services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.10-alpine

    container_name: stalwart

    hostname: mail.techvision.edu.et

    restart: unless-stopped

    environment:
      TZ: Africa/Addis_Ababa
      STALWART_RECOVERY_ADMIN: admin:ChangeThisPassword123!

    volumes:
      - stalwart-data:/opt/stalwart-mail

    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"

    command:
      - sh
      - -c
      - |
        mkdir -p /opt/stalwart-mail/etc

        if [ ! -f /opt/stalwart-mail/etc/config.toml ]; then
          cp /docker-config/config.toml /opt/stalwart-mail/etc/config.toml
        fi

        stalwart --config /opt/stalwart-mail/etc/config.toml


    labels:
      - traefik.enable=true

      - traefik.http.routers.stalwart.rule=Host(`mail.techvision.edu.et`)
      - traefik.http.routers.stalwart.entrypoints=websecure
      - traefik.http.routers.stalwart.tls=true
      - traefik.http.routers.stalwart.tls.certresolver=letsencrypt

      - traefik.http.services.stalwart.loadbalancer.server.port=8080


volumes:
  stalwart-data: