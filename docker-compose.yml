services:

  stalwart:

    build:
      context: .

    container_name: stalwart

    hostname: mail.techvision.edu.et

    restart: unless-stopped


    environment:

      TZ: Africa/Addis_Ababa

    volumes:

      - stalwart-data:/opt/stalwart-mail


    ports:

      - "25:25"
      - "465:465"
      - "587:587"

      - "143:143"
      - "993:993"

      - "4190:4190"

      - "8081:8080"


volumes:

  stalwart-data: