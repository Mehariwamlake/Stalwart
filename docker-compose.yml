
services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest-alpine
    container_name: stalwart-mail
    restart: unless-stopped

    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
      - "8083:8080"   # admin/API

    environment:
      - STALWART_RECOVERY_ADMIN=admin@techvision.edu.et:StrongPass123!

    volumes:
      - ./stalwart-data:/opt/stalwart-mail

    command: >
      /bin/sh -c "
      if [ ! -f /opt/stalwart-mail/etc/config.toml ]; then
        stalwart init;
      fi;
      stalwart run;
      "