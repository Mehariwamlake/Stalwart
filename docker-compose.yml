services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest-alpine
    container_name: stalwart-mail

    hostname: ${MAIL_DOMAIN}

    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "8083:8080"

    volumes:
      - stalwart_data:/opt/stalwart-mail/data
      - ./config:/etc/stalwart:rw

    environment:
      - TZ=${TZ}
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN}

    restart: unless-stopped

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  stalwart_data: