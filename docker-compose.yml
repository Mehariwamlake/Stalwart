services:
  stalwart-mail:
    image: stalwartlabs/stalwart:v0.16.1
    container_name: stalwart-mail
    restart: unless-stopped

    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
      - "8083:8080"

    volumes:
      - ./stalwart-data:/data
      - ./config.toml:/etc/stalwart/config.toml

    command: ["-c", "/etc/stalwart/config.toml"]