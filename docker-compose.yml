To deploy Stalwart Mail Server using Docker Compose, you can use the following configuration based on the official Stalwart Labs installation guide. 
Standard Docker Compose File 
Create a file named docker-compose.yml with the following content: 
yaml
services:
  stalwart-mail:
    image: stalwartlabs/mail-server:latest
    container_name: stalwart-mail
    restart: unless-stopped
    ports:
      - "25:25"      # SMTP
      - "465:465"    # SMTPS
      - "587:587"    # Submission
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "110:110"    # POP3
      - "995:995"    # POP3S
      - "4190:4190"  # ManageSieve
      - "8083:8080"  # Management Interface (HTTP)
      - "443:443"    # Management Interface (HTTPS)
    environment:
      # Optional: Set a fixed admin password (default is generated in logs)
      - STALWART_RECOVERY_ADMIN=admin:yourSecretPass
    volumes:
      - ./stalwart-data:/opt/stalwart-mail
