services:
  stalwart:
    image: stalwartlabs/stalwart:v0.15.4 
    container_name: stalwart_mail.techvision.edu.et
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "8083:8080"
      - "110:110"    # POP3
      - "995:995"    # POP3S
    volumes:
      - stalwart_data:/opt/stalwart-mail
      - ./config:/opt/stalwart-mail/etc:rw
    environment:
      - TZ=${TZ}}
    restart: unless-stopped

volumes:
  stalwart_data:
