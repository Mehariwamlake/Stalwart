services:
  stalwart:
    build:
      context: .

    container_name: stalwart

    hostname: mail.techvision.edu.et

    restart: no

    environment:
      TZ: Africa/Addis_Ababa
      STALWART_RECOVERY_ADMIN: admin:admin

    volumes:
      - stalwart-data:/opt/stalwart-mail

    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"

    labels:
      - traefik.enable=true

      - traefik.http.routers.stalwart.rule=Host(`mail.techvision.edu.et`)
      - traefik.http.routers.stalwart.entrypoints=websecure
      - traefik.http.routers.stalwart.tls=true
      - traefik.http.routers.stalwart.tls.certresolver=letsencrypt

      - traefik.http.services.stalwart.loadbalancer.server.port=8080


volumes:
  stalwart-data: