services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest-alpine
    container_name: stalwart-mail

    hostname: mail.techvision.edu.et

    ports:
      - "25:25"      # SMTP
      - "587:587"    # Submission (STARTTLS)
      - "465:465"    # SMTPS
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "4190:4190"  # ManageSieve
      - "8083:8080"  # Web UI / Admin

    volumes:
      # ✅ MAIN DATA (RocksDB, mailboxes, metadata)
      - stalwart_data:/opt/stalwart-mail/data

      # ✅ CONFIG (from GitHub repo via Dokploy)
      - ./config:/etc/stalwart:rw

    environment:
      - TZ=Africa/Addis_Ababa

    restart: unless-stopped

    # IMPORTANT: DO NOT use custom entrypoint or chown hacks
    # Stalwart handles permissions internally when volume is clean

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  stalwart_data: